adapter driver cmsis-dap
transport select swd
adapter speed 1000

swd newdap chip cpu
dap create chip.dap -chain-position chip.cpu
target create chip.cpu riscv -dap chip.dap -ap-num 0

# We don't have virtual memory, disable this to simplify all memory access commands
riscv set_enable_virt2phys off

# Helper function to load a bitstream into SRAM
set agm_bitloader [file dirname [file normalize [info script]]]/bitloader.bin
proc agm_riscv_load_bitstream {bitstream} {
    set bitstream_size [expr {[file size $bitstream] / 4}]
    
    halt
    load_image $::agm_bitloader 0x20000000
    load_image $bitstream 0x20000100
    mww 0x200000fc $bitstream_size
    resume 0x20000000
}
